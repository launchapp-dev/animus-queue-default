[package]
name = "animus-queue-default"
version = "0.3.1"
edition = "2021"
description = "Reference queue plugin for Animus v0.5 (lift-and-shift of in-tree dispatch queue + atomic queue/lease + queue/release_pending)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/launchapp-dev/animus-queue-default"

[[bin]]
name = "animus-queue-default"
path = "src/main.rs"

[lib]
name = "animus_queue_default"
path = "src/lib.rs"

[dependencies]
animus-plugin-protocol = { path = "../animus-protocol/animus-plugin-protocol" }
animus-queue-protocol = { path = "../animus-protocol/animus-queue-protocol" }
animus-subject-protocol = { path = "../animus-protocol/animus-subject-protocol" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "sync", "fs"] }
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "1"
fs2 = "0.4"
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"

[dev-dependencies]
tempfile = "3"
